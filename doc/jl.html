<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1e2a3e;
            line-height: 1.45;
            padding: 40px 24px;
        }

        .resume {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .resume-inner {
            display: grid;
            grid-template-columns: 34% 66%;
        }

        .sidebar {
            background: #1f2f3c;
            color: #e9f0f5;
            padding: 2rem 1.8rem;
            height: 100%;
        }

        .avatar {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-circle {
            width: 130px;
            height: 130px;
            background: #2c4c6c;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #8db5d6;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.2);
        }

        .avatar-circle i {
            font-size: 4rem;
            color: #cbdbe2;
        }

        .sidebar h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: white;
            margin-bottom: 0.25rem;
            text-align: center;
        }

        .sidebar .title {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            width: 100%;
            padding: 6px 12px;
            border-radius: 40px;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .contact-info {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-left: 4px solid #6c9ebf;
            padding-left: 12px;
            margin: 1.5rem 0 1rem 0;
            color: #f0f4f8;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            word-break: break-word;
        }

        .contact-item i {
            width: 24px;
            text-align: center;
            font-size: 1rem;
            color: #9fc7e0;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .skill-tags span {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #eef2ff;
        }

        .skill-tags .highlight-skill {
            background: rgba(108, 158, 191, 0.3);
            border: 1px solid #8db5d6;
        }

        .lang-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        hr {
            border-color: rgba(255, 255, 255, 0.15);
            margin: 12px 0;
        }

        .main {
            padding: 2rem 2.2rem;
            background: white;
        }

        .right-section {
            margin-bottom: 1.8rem;
        }

        .right-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1f2f3c;
            border-bottom: 3px solid #2c5a7a;
            display: inline-block;
            padding-bottom: 4px;
            margin-bottom: 1rem;
            letter-spacing: -0.2px;
        }

        .job-item,
        .project-item,
        .edu-item {
            margin-bottom: 1.5rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f2c3b;
        }

        .item-date {
            font-size: 0.75rem;
            font-weight: 500;
            color: #5c6f87;
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .item-sub {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2c6e9e;
            margin: 4px 0 8px 0;
        }

        .item-sub .badge {
            background: #2c6e9e;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        .desc-list {
            padding-left: 1.2rem;
            list-style: none;
        }

        .desc-list li {
            font-size: 0.85rem;
            margin-bottom: 6px;
            position: relative;
            padding-left: 18px;
            line-height: 1.4;
        }

        .desc-list li:before {
            content: "▹";
            position: absolute;
            left: 0;
            color: #2c6e9e;
            font-size: 0.75rem;
        }

        .tech-badge {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .tech-badge span {
            background: #eef2fa;
            color: #1f496e;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .tech-badge .ai-tech {
            background: #e8f4e8;
            color: #1a5f1a;
        }

        .highlight {
            background: #ebf4ff;
            border-left: 3px solid #2c5a7a;
            padding: 0.8rem 1rem;
            margin: 0.8rem 0;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #7a8b9f;
            margin-top: 1rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }

        @media (max-width: 780px) {
            .resume-inner {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px 16px;
            }

            .sidebar {
                padding: 1.8rem;
            }

            .item-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }

            .main {
                padding: 1.5rem 1rem;
            }

            .sidebar h1 {
                font-size: 1.5rem;
            }

            .right-title {
                font-size: 1rem;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .resume {
                box-shadow: none;
                border-radius: 0;
            }

            .sidebar {
                background: #1f2f3c !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .skill-tags span {
                background: rgba(255, 255, 255, 0.12) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .tech-badge span {
                background: #eef2fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .highlight {
                background: #ebf4ff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

        function renderSection(title, icon, content) {
            return `
                <div class="section-title"><i class="fas fa-${icon}"></i> ${title}</div>
                ${content}
            `;
        }

        function renderSkillTags(skills) {
            const aiKeywords = ['LLM', 'Agent', 'WebSocket', 'Prompt', 'Tornado', 'TypeScript'];
            return `<div class="skill-tags">${skills.map(s => {
                const isAi = aiKeywords.some(k => s.includes(k));
                return `<span class="${isAi ? 'highlight-skill' : ''}">${s}</span>`;
            }).join('')}</div>`;
        }

        function renderPhilosophy(items) {
            return `<ul class="desc-list" style="list-style: none; padding-left: 0;">
                ${items.map(item => `<li>📌 ${item}</li>`).join('')}
            </ul>`;
        }

        function renderLanguages(languages, certificates) {
            const langHtml = languages.map(l =>
                `<div class="lang-item"><span>${l.name}</span><span>${l.level}</span></div>`
            ).join('');
            const certHtml = `<hr><div class="skill-tags">${certificates.map(c => `<span>${c}</span>`).join('')}</div>`;
            return langHtml + certHtml;
        }

                    <div class="edu-item">
                        <div class="item-header">
                            <span class="item-title">${education.school}</span>
                            <span class="item-date">${education.date}</span>
                        </div>
                        <div>${education.major}</div>
                        <div class="tech-badge" style="margin-top: 6px;">
                            ${education.courses.map(c => `<span>${c}</span>`).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderSummary(summary) {
            return `
                <div class="highlight">
                    <i class="fas fa-lightbulb" style="margin-right: 8px; color: #2c5a7a;"></i>
                    <strong>技术沉淀与洞见</strong><br />
                    ${summary}
                </div>
            `;
        }

        renderSidebar(resumeData);
        renderMain(resumeData);
    </script>
</body>

</html>
